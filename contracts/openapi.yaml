          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
  /invites/join:
    post:
      operationId: joinInvite
      summary: Redeem one-time invite with explicit participant consent; token returned
