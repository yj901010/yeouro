openapi: 3.0.3
info:
  title: Yeouro app-only MVP API
  version: 0.1.0
  description: 'Authoritative first-slice contract. No Pleos SDK connection or background
    delivery. All responses Cache-Control: no-store. Tokens are scoped bearer capabilities:
    keep in memory for this slice, and encrypted device storage if later persisted;
    never log or put them in URLs. Create/join return credentials once and must not
    be automatically retried after an uncertain response. All times UTC ISO-8601.
    Place coordinates must be both present or both null. Session lifetime 24h; one-time
    invite 15m. First stage uses authenticated foreground polling, not SSE. Local
    default server binds loopback; not an internet deployment.'
servers:
- url: http://localhost:8080/api/v1
  description: Local development only
paths:
  /health:
    get:
      operationId: health
      summary: Minimal liveness only
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          description: Invalid input or missing consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, expired or revoked capability token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Wrong role or trip scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State/version conflict, expired/consumed invite, stale location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Local safety limits exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips:
    post:
      operationId: createTrip
      summary: Create a 24-hour trip; credentials are returned once
      security: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Invalid input or missing consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, expired or revoked capability token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Wrong role or trip scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State/version conflict, expired/consumed invite, stale location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Local safety limits exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
  /trips/{tripId}:
    get:
      operationId: getTrip
      summary: Poll only while foregrounded; recommend every 5 seconds
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid input or missing consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, expired or revoked capability token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Wrong role or trip scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State/version conflict, expired/consumed invite, stale location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Local safety limits exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tripId
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
  /trips/{tripId}/invites:
    post:
      operationId: createInvite
      summary: Owner explicitly consents to this trip sharing; one-time invite valid
        15 minutes
      security:
      - bearerAuth: []
