name: Verify MVP foundation
on:
  pull_request:
  push:
    branches: [main, 'feat/android-mvp-foundation']
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: prototype
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sh ./mvnw --batch-mode test
        working-directory: services/backend
  shared-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sh ./gradlew -PjvmOnly=true test --no-daemon
        working-directory: apps/android
