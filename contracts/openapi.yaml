        in: path
        required: true
        schema: *id001
  /trips/{tripId}/proposals/{proposalId}/navigation-result:
    post:
      operationId: reportNavigationResult
      summary: Owner/driver reports gateway result; APPLIED rejected while integration
        unavailable; DEMO_APPLIED is not real navigation
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid input or missing consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, expired or revoked capability token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Wrong role or trip scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
