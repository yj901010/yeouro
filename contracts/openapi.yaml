  /trips/{tripId}/readiness:
    put:
      operationId: updateReadiness
      summary: Participant readiness; repeated identical PUT is safe
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
