  /trips/{tripId}/proposals:
    post:
      operationId: submitProposal
      summary: Participant proposal; requestId deduplicated within participant/trip
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid input or missing consent
          content:
