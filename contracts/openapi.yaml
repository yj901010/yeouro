              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigationResultRequest'
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
      - name: proposalId
        in: path
        required: true
        schema: *id001
  /trips/{tripId}/location:
    put:
      operationId: uploadLocation
      summary: Owner/driver only while sharing; maximum age 2 minutes, future skew
        30 seconds; strict newer observedAt
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid input or missing consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, expired or revoked capability token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Wrong role or trip scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State/version conflict, expired/consumed invite, stale location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
