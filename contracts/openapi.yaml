      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalRequest'
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
  /trips/{tripId}/proposals/{proposalId}/decision:
    post:
      operationId: decideProposal
      summary: Owner/driver accept only requests application; use proposal version
        for concurrency
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid input or missing consent
          content:
            application/json:
              schema:
