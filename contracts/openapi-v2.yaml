openapi: 3.0.3
info:
  title: Yeouro implemented v2 API
  version: 0.2.0
  description: 'Implemented local PostgreSQL v2 slice, opt-in via yeouro.v2.enabled. No deployment or real SDK/provider
    integration implied. Separate from unchanged v1. Phone JWT signature, issuer, expiry and audience validation
    require configured issuer/JWKS; no anonymous fallback. All examples synthetic, timestamps illustrative (replace
    with fresh times). POST requires Idempotency-Key (1..128 chars): 24h principal+route scope, canonical payload
    conflict 409, access rechecked before replay. Secret issuance replays 409 SECRET_ALREADY_ISSUED. Full privacy
    and implementation differences: docs/v2/API_CONTRACT.md. Only listed paths exist; no account deletion, outcome
    reconciliation or refresh endpoint.'
servers:
- url: /api/v2
  description: Same-origin v2 API; local implementation, use HTTPS for any authorized external deployment.
paths:
  /trips/{tripId}/sharing-sessions:
    post:
      operationId: startSharing
      summary: Owner starts a new sharing generation
      security:
      - PhoneJwt: []
      responses:
        '201':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingSession'
              example:
                sessionId: 11111111-1111-4111-8111-111111111111
                generation: 1
                expiresAt: '2026-10-28T09:00:00Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
            example:
              scopes:
              - TRIP_COLLABORATION
              - LOCATION_PUBLISH
              - LOCATION_VIEW
              consentPolicyVersion: v1
      parameters:
      - name: tripId
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
  /trips/{tripId}/invites:
    post:
      operationId: issueInvite
      summary: Owner issues a single-use invite
      security:
      - PhoneJwt: []
      responses:
        '201':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
              example:
                id: 11111111-1111-4111-8111-111111111111
                code: Synthetic code
                expiresAt: '2026-10-28T09:00:00Z'
                role: DRIVER
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      description: Expires in at most 900 seconds and never beyond session. New issue revokes previous unconsumed
        invites by this owner. DRIVER role rejected while an active driver exists. Same-key replay returns 409 SECRET_ALREADY_ISSUED;
        raw code is not persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
            example:
              role: COMPANION
              sessionId: 11111111-1111-4111-8111-111111111111
              expiresInSeconds: 900
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
  /invites/join:
    post:
      operationId: joinInvite
      summary: Authenticated account consumes invite
      security:
      - PhoneJwt: []
      responses:
        '201':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
              example:
                tripId: 11111111-1111-4111-8111-111111111111
                participantId: 11111111-1111-4111-8111-111111111111
                role: DRIVER
                sharingGeneration: 1
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      description: No phone token is issued. Same-key exact replay is allowed only while original membership/session
        access remains authorized; changed payload conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
            example:
              code: synthetic-one-time-code
              consentScopes:
              - TRIP_COLLABORATION
              - LOCATION_VIEW
              consentPolicyVersion: v1
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
  /trips/{tripId}/sharing/revoke:
    post:
      operationId: revokeSharing
      summary: Owner revokes all sharing
      security:
      - PhoneJwt: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revoked'
              example:
                sharingEnabled: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      description: Clears latest location, revokes invites and credentials, cancels pending commands; claimed execution
        is preserved as OUTCOME_UNKNOWN, not assumed cancelled in the real world. Nonowner memberships become LEFT
        and all participant consent versions increment. Restart requires new invitation + join for nonowners; previous
        membership cannot directly regrant consent.
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
  /trips/{tripId}/consents/me:
    put:
      operationId: updateOwnConsents
      summary: Update own consent scopes
      security:
      - PhoneJwt: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
              example:
                sessionId: 11111111-1111-4111-8111-111111111111
                scopes: {}
                version: 0
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
            example:
              scopes:
                LOCATION_VIEW: false
              consentPolicyVersion: v1
              expectedVersion: 0
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
      description: Only own scopes may be changed. Personal collaboration revocation retains membership in the same
        sharing generation; recover current consent version through GET on this route if the PUT response was lost.
        It does not revive revoked vehicle credentials. Global sharing revocation instead ends nonowner membership
        and requires a new invitation/join.
    get:
      operationId: getOwnConsents
      summary: Recover own consent state and version
      description: Phone active member can read own consent after personal TRIP_COLLABORATION revoke or a lost consent
        PUT response, without reading shared trip data. Requires an active sharing session. Global sharing revoke
        sets nonowner memberships LEFT; those users cannot use this route to bypass fresh invitation and join into
        a restarted generation. Vehicle credentials are not allowed.
      security:
      - PhoneJwt: []
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Own current-generation consent state
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnConsents'
              example:
                sessionId: 11111111-1111-4111-8111-111111111111
                generation: 1
                version: 2
                scopes:
                  TRIP_COLLABORATION: false
                  LOCATION_VIEW: false
                  LOCATION_PUBLISH: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      x-privacy: Own consent only; no-store; no other member information.
  /trips/{tripId}/memberships/me:
    delete:
      operationId: leaveTrip
      summary: Non-owner leaves own membership
      security:
      - PhoneJwt: []
      responses:
        '204':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      description: Owner must end or cancel instead. Leaving driver revokes vehicle credentials and pending work.
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
  /trips/{tripId}/readiness/me:
    put:
      operationId: setReadiness
      summary: Companion reports own readiness
      security:
      - PhoneJwt: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                participantId: 11111111-1111-4111-8111-111111111111
                ready: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadinessRequest'
            example:
              ready: true
              observedAt: '2026-10-28T09:00:00Z'
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
  /trips/{tripId}/location:
    put:
      operationId: publishLocation
      summary: Driver publishes latest observation
      security:
      - PhoneJwt: []
      - VehicleBearer: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationMetadata'
              example:
                observationId: 11111111-1111-4111-8111-111111111111
                receivedAt: '2026-10-28T09:00:00Z'
                freshness: FRESH
                ageSeconds: 0
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      description: Requires active sharing generation and LOCATION_PUBLISH consent/scope. Only latest point retained.
        Same observationId + normalized payload replays metadata; changed payload 409 OBSERVATION_REUSED. Older
        timestamps or age >120s/future >30s rejected. No Idempotency-Key needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
            example:
              observationId: 55555555-5555-4555-8555-555555555555
              sharingGeneration: 1
              latitude: 37.5
              longitude: 127.0
              accuracyMeters: 18
              observedAt: '2026-10-28T09:00:00Z'
              source: PHONE
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
  /vehicle-pairings:
    post:
      operationId: startPairing
      summary: Create short-lived vehicle pairing challenge
      security: []
      responses:
        '201':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingIssued'
              example:
                pairingId: 11111111-1111-4111-8111-111111111111
                displayCode: Synthetic displayCode
                pollSecret: Synthetic pollSecret
                expiresAt: '2026-10-28T09:00:00Z'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
      description: Public local-development entry, five-minute challenge. Local per-installation/global budgets
        are not production internet abuse protection. Same-key replay returns SECRET_ALREADY_ISSUED; start new pairing
        on lost response. No Retry-After guarantee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingRequest'
            example:
              installationId: 11111111-1111-4111-8111-111111111111
              displayLabel: Synthetic demo vehicle
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
  /vehicle-pairings/{pairingId}/approve:
    post:
      operationId: approvePairing
      summary: Current driver phone approves vehicle
      security:
      - PhoneJwt: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingApproved'
              example:
                pairingId: 11111111-1111-4111-8111-111111111111
                status: APPROVED
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingApprovalRequest'
            example:
              tripId: 11111111-1111-4111-8111-111111111111
              displayCode: synthetic-display-code
              scopes:
              - TRIP_READ
              - NAV_COMMAND_CLAIM
              - NAV_RESULT_WRITE
      parameters:
      - name: pairingId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
  /vehicle-pairings/{pairingId}:
    get:
      operationId: pollPairing
      summary: Poll status without account details
      security:
      - PairingPollSecret: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingStatus'
              example:
                pairingId: 11111111-1111-4111-8111-111111111111
                status: PENDING
                expiresAt: '2026-10-28T09:05:00Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
      parameters:
      - name: pairingId
        in: path
        required: true
        schema: *id001
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
  /vehicle-pairings/{pairingId}/claim:
    post:
      operationId: claimPairingCredential
      summary: Claim one-time vehicle credential
      security:
      - PairingPollSecret: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleCredential'
              example:
                pairingId: 11111111-1111-4111-8111-111111111111
                tripId: 11111111-1111-4111-8111-111111111111
                credential: Synthetic credential
                expiresAt: '2026-10-28T09:00:00Z'
                scopes: []
                sharingGeneration: 1
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      description: Opaque credential max lifetime 12 hours, bounded by trip and sharing expiry. Lost claim response
        requires new pairing, not refresh/replay. Never share phone JWT/refresh token with vehicle.
      parameters:
      - name: pairingId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
  /trips/{tripId}/vehicle-pairings/{pairingId}:
    delete:
      operationId: revokePairing
      summary: Owner or driver revokes vehicle pairing
      security:
      - PhoneJwt: []
      responses:
        '204':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
      - name: pairingId
        in: path
        required: true
        schema: *id001
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
  /trips/{tripId}/proposals:
    post:
      operationId: submitProposal
      summary: Phone collaborator proposes a place
      security:
      - PhoneJwt: []
      responses:
        '201':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
              example:
                id: 11111111-1111-4111-8111-111111111111
                kind: DESTINATION
                decisionStatus: PENDING
                version: 0
                place:
                  name: Synthetic name
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      description: Any phone member with current collaboration consent may submit (not companion-only). comparisonId
        is not implemented.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalRequest'
            example:
              kind: DESTINATION
              place:
                name: Synthetic concert hall
                latitude: 37.5
                longitude: 127.0
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
    get:
      operationId: listProposals
      summary: Discover proposals and command outcomes through foreground polling
      description: Phone reader or vehicle TRIP_READ, with live trip, active sharing and the caller's TRIP_COLLABORATION
        consent. OWNER alone does not bypass collaboration consent. Only current-generation proposals are visible.
        Newest first; no arbitrary offset. Cross-trip or prior-generation cursor is 404. Expired command leases
        are reflected as EXPIRED or OUTCOME_UNKNOWN, never inferred success. This is not an SDK result reconciliation
        endpoint.
      security:
      - PhoneJwt: []
      - VehicleBearer: []
      parameters:
      - name: tripId
        in: path
        required: true
        schema: &id002
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema: *id002
        description: Use nextCursor from previous page; omit to poll newest page.
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - DISMISSED
          - CANCELLED
        description: Filter proposal decision state, not command execution outcome.
      responses:
        '200':
          description: Current-generation proposal page
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalList'
              example:
                proposals:
                - id: 33333333-3333-4333-8333-333333333333
                  kind: DESTINATION
                  decisionStatus: PENDING
                  version: 0
                  place:
                    name: Synthetic concert hall
                    latitude: 37.5
                    longitude: 127.0
                  navigationCommand: null
                nextCursor: null
                serverTime: '2026-10-28T09:00:00Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      x-privacy: no-store; current generation only; synthetic examples; redact precise locations
  /trips/{tripId}/proposals/{proposalId}/decision:
    post:
      operationId: decideProposal
      summary: Driver decides proposal independently of SDK result
      security:
      - PhoneJwt: []
      - VehicleBearer: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
              example:
                proposal:
                  id: 11111111-1111-4111-8111-111111111111
                  kind: DESTINATION
                  decisionStatus: PENDING
                  version: 0
                  place:
                    name: Synthetic name
                tripRevision: 0
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
