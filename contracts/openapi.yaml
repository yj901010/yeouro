      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
  /trips/{tripId}/sharing/revoke:
    post:
      operationId: revokeSharing
      summary: Owner revokes invites/participant tokens, clears location, cancels
        pending commands
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid input or missing consent
          content:
            application/json:
