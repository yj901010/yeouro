          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
  /trips/{tripId}/end:
    post:
      operationId: endTrip
      summary: Owner/driver ends trip and revokes sharing; repeated end is safe for
        owner
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid input or missing consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
