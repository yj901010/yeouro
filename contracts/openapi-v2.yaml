          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
              example:
                id: 11111111-1111-4111-8111-111111111111
                status: PLANNED
                phase: null
                revision: 0
                planRevision: 0
                version: 0
                title: null
                destination:
                  name: Synthetic name
                deadlineAt: null
                arrivalBasis: PERSON
                plannedStayMinutes: null
                timeZone: Synthetic timeZone
                expiresAt: '2026-10-28T09:00:00Z'
                sharing: null
                location: null
                participants: []
                capabilities:
                  navigation:
                    availability: UNAVAILABLE
                    reason: Synthetic reason
                serverTime: '2026-10-28T09:00:00Z'
                stops: []
                viewer:
                  participantId: 11111111-1111-4111-8111-111111111111
                  role: DRIVER
                  isOwner: true
                  clientType: PHONE
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
      description: Not JSON Merge Patch. destination and timeZone required. ownerRole cannot be changed. Omitted
        expiresAt retains previous expiry; other omitted optional fields clear/reset. Use latest planRevision, independent
        of location updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plan'
            example:
              destination:
                name: Synthetic revised hall
              timeZone: Asia/Seoul
              arrivalBasis: PERSON
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/PlanMatch'
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
  /trips/{tripId}/start:
    post:
      operationId: startTrip
      summary: Owner or driver starts planned trip
      security:
      - PhoneJwt: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transition'
              example:
                id: 11111111-1111-4111-8111-111111111111
                status: ACTIVE
                version: 0
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      description: expectedVersion is trip.version. Start sets ACTIVE/DRIVING; end/cancel revoke sharing, location,
        invitations and vehicle credentials atomically. Authorization is rechecked before idempotency replay; a
        revoked vehicle cannot replay after ending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
            example:
              expectedVersion: 0
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
  /trips/{tripId}/end:
    post:
      operationId: endTrip
      summary: Owner, driver or scoped vehicle ends trip
      security:
      - PhoneJwt: []
      - VehicleBearer: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transition'
              example:
                id: 11111111-1111-4111-8111-111111111111
                status: ACTIVE
                version: 0
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      description: expectedVersion is trip.version. Start sets ACTIVE/DRIVING; end/cancel revoke sharing, location,
        invitations and vehicle credentials atomically. Authorization is rechecked before idempotency replay; a
        revoked vehicle cannot replay after ending. End requires ACTIVE; use cancel for a PLANNED trip.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
            example:
              expectedVersion: 0
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
  /trips/{tripId}/cancel:
    post:
      operationId: cancelTrip
      summary: Owner cancels trip
      security:
      - PhoneJwt: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache sensitive API responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transition'
              example:
                id: 11111111-1111-4111-8111-111111111111
                status: ACTIVE
                version: 0
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      description: expectedVersion is trip.version. Start sets ACTIVE/DRIVING; end/cancel revoke sharing, location,
        invitations and vehicle credentials atomically. Authorization is rechecked before idempotency replay; a
        revoked vehicle cannot replay after ending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
            example:
              expectedVersion: 0
      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      x-privacy: no-store; synthetic examples only; redact credentials and exact coordinates
components:
  securitySchemes:
    PhoneJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Phone account JWT with UUID sub, valid signature/issuer/audience/expiry. Not v1 capabilities.
        Never give phone refresh token to vehicle.
    VehicleBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Short-lived one-trip credential issued by pairing claim; DB checked for revocation and scope
        on every request, not a phone JWT.
    PairingPollSecret:
      type: apiKey
      in: header
      name: X-Pairing-Poll-Secret
      description: Opaque one-pairing polling/claim secret; distinct from vehicle bearer and JWT. Never URL/query.
        Actual implementation uses this header, not Authorization.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: See operation-specific retry rules; do not assume secret issuance can be replayed.
    PlanMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"plan-[0-9]+"$
      example: '"plan-0"'
      description: Quoted current planRevision ETag, not trip revision.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
      description: Redacted domain or request error; the implementation does not return the future-design requestId/currentVersion/retryable
        fields.
    Place:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
      required:
      - name
      description: Coordinates must be finite and supplied together or both omitted/null; sensitive destination.
      x-sensitive: true
    PlanningPlace:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
      required:
      - name
      description: Coordinates must be finite and supplied as a pair.
      x-sensitive: true
    Stop:
      type: object
      properties:
        place:
          $ref: '#/components/schemas/PlanningPlace'
        stayMinutes:
          type: integer
          format: int64
          minimum: 0
          maximum: 10080
        walkToPlaceSeconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 604800
          nullable: true
        returnWalkSeconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 604800
          nullable: true
      required:
      - place
      description: Omitted stayMinutes defaults to 0. Missing walking measurements remain unknown, not zero.
    StopsRequest:
      type: object
      properties:
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
          maxItems: 20
      required:
      - stops
    StopsResponse:
      type: object
      properties:
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
        planRevision:
          type: integer
          format: int64
          minimum: 0
        revision:
          type: integer
          format: int64
          minimum: 0
      required:
      - stops
      - planRevision
      - revision
    Origin:
      type: object
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        observedAt: &id004
          type: string
          format: date-time
        source:
          type: string
          enum:
          - PHONE
          - VEHICLE
          - SIMULATED
      required:
      - latitude
      - longitude
      - observedAt
      - source
      description: Sensitive coordinates. Origin age <=120 seconds, future skew <=30 seconds; client-reported source
        is not OEM attestation.
      x-sensitive: true
    ComparisonRequest:
      type: object
      properties:
        mode:
          type: string
          enum:
          - REAL
          - DEMO
        origin:
          $ref: '#/components/schemas/Origin'
        parkingDurationMinutes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10080
        tripPlanRevision:
          type: integer
          format: int64
          minimum: 0
      required:
      - mode
      - origin
      - parkingDurationMinutes
      description: Destination and stops come from the server plan. Omitted tripPlanRevision defaults to 0. REAL
        fails ROUTING_UNAVAILABLE (503).
    Fee:
      type: object
      properties:
        estimatedAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        currency:
          type: string
          enum:
          - KRW
        pricingDurationMinutes:
          type: integer
          format: int64
          minimum: 1
        rulesAsOf:
          type: string
          format: date-time
          nullable: true
        availability:
          type: string
          enum:
          - ESTIMATED
      required:
      - estimatedAmount
      - currency
      - pricingDurationMinutes
      - rulesAsOf
      - availability
    Occupancy:
      type: object
      properties:
        availability:
          type: string
          enum:
          - UNKNOWN
        availableSpaces:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        observedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - availability
      - availableSpaces
      - observedAt
      description: No real occupancy provider. Values remain null, never interpreted as free spaces.
    Provenance:
      type: object
      properties:
        metric:
          type: string
        provider:
          type: string
          enum:
          - FIXTURE
          - USER_PLAN
        source:
          type: string
          enum:
          - SIMULATED
          - CALCULATED
        fetchedAt: *id004
        assumptions:
          type: array
          items:
            type: string
      required:
      - metric
      - provider
      - source
      - fetchedAt
      - assumptions
    Candidate:
      type: object
      properties:
        candidateId:
          type: string
        vehicleArrivalAt:
          type: string
          format: date-time
          nullable: true
        personArrivalAt:
          type: string
          format: date-time
          nullable: true
        drivingSeconds:
          type: integer
          format: int64
          minimum: 0
        parkingSearchSeconds:
          type: integer
          format: int64
          minimum: 0
        walkToDestinationSeconds:
          type: integer
          format: int64
          minimum: 0
        returnWalkSeconds:
          type: integer
          format: int64
          minimum: 0
        intermediateStaySeconds:
          type: integer
          format: int64
          minimum: 0
        intermediateSeconds:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        slackSeconds:
          type: integer
          format: int64
          nullable: true
        arrivalBasis:
          type: string
          enum:
          - PERSON
          - VEHICLE
        quality:
          type: string
          enum:
          - COMPLETE
          - PARTIAL
          - UNAVAILABLE
        fee:
          $ref: '#/components/schemas/Fee'
        occupancy:
          $ref: '#/components/schemas/Occupancy'
        provenance:
          type: array
          items:
            $ref: '#/components/schemas/Provenance'
        warnings:
          type: array
          items:
            type: string
      required:
      - candidateId
      - vehicleArrivalAt
      - personArrivalAt
      - drivingSeconds
      - parkingSearchSeconds
      - walkToDestinationSeconds
      - returnWalkSeconds
      - intermediateStaySeconds
      - intermediateSeconds
      - slackSeconds
      - arrivalBasis
      - quality
      - fee
      - occupancy
      - provenance
      - warnings
    Comparison:
      type: object
      properties:
        comparisonId: *id001
        mode:
          type: string
          enum:
          - DEMO
        tripPlanRevision:
          type: integer
          format: int64
          minimum: 0
        calculatedAt: *id004
        expiresAt: *id004
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
      required:
      - comparisonId
      - mode
      - tripPlanRevision
      - calculatedAt
      - expiresAt
      - candidates
      description: Immutable synthetic snapshot, five-minute lifetime. Negative slack means predicted lateness.
        Not a navigation command.
    ComparisonRead:
      type: object
      properties:
        snapshot:
          $ref: '#/components/schemas/Comparison'
        stalePlan: &id005
          type: boolean
        expired: *id005
      required:
      - snapshot
      - stalePlan
      - expired
    ParkingRequest:
      type: object
      properties:
        parkedAt: *id004
        place:
          $ref: '#/components/schemas/PlanningPlace'
        source:
          type: string
          enum:
          - USER_CONFIRMED
        userConfirmed:
          type: boolean
          enum:
          - true
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
      required:
      - parkedAt
      - place
      - source
      - userConfirmed
      description: Requires userConfirmed=true; SDK arrival cannot confirm parking. Omitted expectedVersion defaults
        to 0.
    PhaseRequest:
      type: object
      properties:
        phase:
          type: string
          enum:
          - DRIVING
          - WALKING
          - AT_DESTINATION
          - RETURNING
        observedAt: *id004
        source:
          type: string
          enum:
          - USER_CONFIRMED
        userConfirmed:
          type: boolean
          enum:
          - true
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
      required:
      - phase
      - observedAt
      - source
      - userConfirmed
    ReminderRequest:
      type: object
      properties:
        enabled: *id005
        anchor:
          type: string
          enum:
          - PARKING_CONFIRMED
          - PERSON_ARRIVAL_CONFIRMED
        stayMinutes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10080
        leadMinutes:
          type: integer
          format: int64
          minimum: 0
          maximum: 10080
        reminderBasis:
          type: string
          enum:
          - STAY_END
          - RETURN_TO_CAR
        returnWalkSeconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 604800
          nullable: true
      required:
      - anchor
      - stayMinutes
      - reminderBasis
      description: leadMinutes cannot exceed stayMinutes. RETURN_TO_CAR requires returnWalkSeconds; computed offset
        cannot be negative. Omitted enabled=false and leadMinutes=0.
    ClientStatusRequest:
      type: object
      properties:
        planVersion: &id015
          type: integer
          format: int64
          minimum: 0
        installationId: *id001
        status: &id016
          type: string
          enum:
          - SCHEDULED
          - PERMISSION_DENIED
          - CANCELLED
          - ERROR
        observedAt: *id004
      required:
      - installationId
      - status
      - observedAt
      description: Omitted planVersion defaults to 0. This is a client report, not delivery evidence.
    LocationRequest:
      type: object
      properties:
        observationId: *id001
        sharingGeneration:
          type: integer
          format: int64
          minimum: 1
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          format: double
          minimum: 0
          maximum: 10000
        observedAt: *id004
        source:
          type: string
          enum:
          - PHONE
          - VEHICLE
          - SIMULATED
        publisherSequence:
          type: integer
          format: int64
          minimum: 0
          nullable: true
      required:
      - observationId
      - sharingGeneration
      - observedAt
      - source
      description: Exact coordinates are sensitive. Phone JWT must report PHONE; vehicle credential must report
        VEHICLE; SIMULATED needs demo enabled. Omitted numeric latitude/longitude/accuracy default to zero; clients
        should always supply them explicitly. Timestamp normalized to milliseconds.
      x-sensitive: true
    LocationMetadata:
      type: object
      properties:
        observationId: *id001
        receivedAt: *id004
        freshness: &id006
          type: string
          enum:
          - FRESH
          - STALE
        ageSeconds: &id007
          type: integer
          format: int64
          minimum: 0
      required:
      - observationId
      - receivedAt
      - freshness
      - ageSeconds
    Location:
      type: object
      properties:
        observationId: *id001
        receivedAt: *id004
        freshness: *id006
        ageSeconds: *id007
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          format: double
          minimum: 0
          maximum: 10000
        observedAt: *id004
        source:
          type: string
          enum:
          - PHONE
          - VEHICLE
          - SIMULATED
      required:
      - observationId
      - receivedAt
      - freshness
      - ageSeconds
      - latitude
      - longitude
      - accuracyMeters
      - observedAt
      - source
      x-sensitive: true
    SessionRequest:
      type: object
      properties:
        scopes: &id010
          type: array
          items:
            type: string
            enum:
            - TRIP_COLLABORATION
            - LOCATION_PUBLISH
            - LOCATION_VIEW
        consentPolicyVersion: &id011
          type: string
          minLength: 1
          maxLength: 40
      required:
      - scopes
      - consentPolicyVersion
    SharingSession:
      type: object
      properties:
        sessionId: *id001
        generation:
          type: integer
          format: int64
          minimum: 1
        expiresAt: *id004
      required:
      - sessionId
      - generation
      - expiresAt
    InviteRequest:
      type: object
      properties:
        role: &id008
          type: string
          enum: &id017
          - DRIVER
          - COMPANION
        sessionId: *id001
        expiresInSeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 900
          default: 900
      required:
      - role
      - sessionId
    Invite:
      type: object
      properties:
        id: *id001
        code: &id009
          type: string
          minLength: 1
          x-sensitive: true
          description: One-time secret; never put in URL, logs or analytics.
        expiresAt: *id004
        role: *id008
      required:
      - id
      - code
      - expiresAt
      - role
    JoinRequest:
      type: object
      properties:
        code: *id009
        consentScopes: *id010
        consentPolicyVersion: *id011
      required:
      - code
      - consentScopes
      - consentPolicyVersion
      description: TRIP_COLLABORATION must be explicitly selected. LOCATION_PUBLISH is driver-only. Name comes from
        account, not request.
    Membership:
      type: object
      properties:
        tripId: *id001
        participantId: *id001
        role: *id008
        sharingGeneration:
          type: integer
          format: int64
          minimum: 1
      required:
      - tripId
      - participantId
      - role
      - sharingGeneration
    ConsentRequest:
      type: object
      properties:
        scopes: &id012
          type: object
          properties:
            TRIP_COLLABORATION: *id005
            LOCATION_VIEW: *id005
            LOCATION_PUBLISH: *id005
          additionalProperties: false
        consentPolicyVersion: *id011
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
      required:
      - scopes
      - consentPolicyVersion
      - expectedVersion
      description: Version of this participant consent record, initially 0; not trip revision. Only provided scopes
        are changed; false revokes, true grants.
    Consent:
      type: object
      properties:
        sessionId: *id001
        scopes: *id012
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - sessionId
      - scopes
      - version
      description: scopes echoes this update, not necessarily the full active consent set.
    ReadinessRequest:
      type: object
      properties:
        ready: *id005
        observedAt: *id004
      required:
      - observedAt
      description: Omitted ready defaults false. Future skew maximum 30 seconds.
    Readiness:
      type: object
      properties:
        participantId: *id001
        ready: *id005
      required:
      - participantId
      - ready
    Revoked:
      type: object
      properties:
        sharingEnabled:
          type: boolean
          enum:
          - false
      required:
      - sharingEnabled
    PairingRequest:
      type: object
      properties:
        installationId: *id001
        displayLabel:
          type: string
          nullable: true
      required:
      - installationId
      description: displayLabel is currently accepted but not persisted or returned. Installation ID is not proof
        of vehicle ownership.
    PairingIssued:
      type: object
      properties:
        pairingId: *id001
        displayCode: *id009
        pollSecret: *id009
        expiresAt: *id004
      required:
      - pairingId
      - displayCode
      - pollSecret
      - expiresAt
    PairingApprovalRequest:
      type: object
      properties:
        tripId: *id001
        displayCode: *id009
        scopes:
          type: array
          items: &id013
            type: string
            enum:
            - TRIP_READ
            - LOCATION_PUBLISH
            - NAV_COMMAND_CLAIM
            - NAV_RESULT_WRITE
            - PROPOSAL_DECIDE
            - TRIP_END
            - PARKING_CONFIRM
            - TRIP_PHASE
          minItems: 1
      required:
      - tripId
      - displayCode
      - scopes
      description: Phone current DRIVER approves an explicit scope allowlist; LOCATION_PUBLISH additionally requires
        driver publication consent.
    PairingApproved:
      type: object
      properties:
        pairingId: *id001
        status:
          type: string
          enum:
          - APPROVED
      required:
      - pairingId
      - status
    PairingStatus:
      type: object
      properties:
        pairingId: *id001
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - CLAIMED
          - REVOKED
          - EXPIRED
        expiresAt: *id004
      required:
      - pairingId
      - status
      - expiresAt
    VehicleCredential:
      type: object
      properties:
        pairingId: *id001
        tripId: *id001
        credential: *id009
        expiresAt: *id004
        scopes:
          type: array
          items: *id013
        sharingGeneration:
          type: integer
          format: int64
          minimum: 1
      required:
      - pairingId
      - tripId
      - credential
      - expiresAt
      - scopes
      - sharingGeneration
    ProposalRequest:
      type: object
      properties:
        kind:
          type: string
          enum:
          - DESTINATION
          - STOP
          - PARKING
        place:
          $ref: '#/components/schemas/Place'
      required:
      - kind
      - place
    Proposal:
      type: object
      properties:
        id: *id001
        kind:
          type: string
          enum:
          - DESTINATION
          - STOP
          - PARKING
        decisionStatus:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - DISMISSED
          - CANCELLED
        version:
          type: integer
          format: int64
          minimum: 0
        place:
          $ref: '#/components/schemas/Place'
      required:
      - id
      - kind
      - decisionStatus
      - version
      - place
    DecisionRequest:
      type: object
      properties:
        decision:
          type: string
          enum:
          - ACCEPT
          - DISMISS
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        mode:
          type: string
          enum:
          - PLEOS
          - DEMO
          default: PLEOS
      required:
      - decision
      - expectedVersion
      description: expectedVersion is proposal.version. ACCEPT does not prove navigation application.
    NavigationCommand:
      type: object
      properties:
        id: *id001
        status:
          type: string
          enum: *id014
        version:
          type: integer
          format: int64
          minimum: 0
        commandType:
          type: string
          enum:
          - SET_DESTINATION
          - ADD_STOP
          - SELECT_PARKING
        integrationMode:
          type: string
          enum:
          - PLEOS
          - DEMO
        reason:
          type: string
          nullable: true
        expiresAt: *id004
        target:
          $ref: '#/components/schemas/Place'
      required:
      - id
      - status
      - version
      - commandType
      - integrationMode
      - reason
      - expiresAt
      - target
      description: Real APPLIED is not available. OUTCOME_UNKNOWN blocks further acceptance; no reconciliation endpoint
        is implemented. Do not automatically execute again.
    NavigationAvailability:
      type: object
      properties:
        availability:
          type: string
          enum:
          - UNAVAILABLE
          - SIMULATED
        reason:
          type: string
      required:
      - availability
      - reason
    DecisionResponse:
      type: object
      properties:
        proposal:
          $ref: '#/components/schemas/Proposal'
        navigationCommand:
          $ref: '#/components/schemas/NavigationCommand'
        navigation:
          $ref: '#/components/schemas/NavigationAvailability'
        tripRevision:
          type: integer
          format: int64
          minimum: 0
      required:
      - proposal
      - tripRevision
      description: DISMISS omits navigationCommand and navigation. ACCEPT creates command, possibly immediately
        FAILED.
    Commands:
      type: object
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/NavigationCommand'
      required:
      - commands
    CommandClaimRequest:
      type: object
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
      required:
      - expectedVersion
    CommandResultRequest:
      type: object
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        outcome:
          type: string
          enum:
          - DEMO_APPLIED
          - FAILED
      required:
      - expectedVersion
      - outcome
      description: expectedVersion is command.version. APPLIED is rejected with 400 SDK_NOT_CONNECTED. No provider
        evidence or real SDK result contract exists yet.
    ParkingConfirmation:
      type: object
      properties:
        id: *id001
        phase:
          type: string
          enum:
          - PARKED
        parkedAt: *id004
        source:
          type: string
          enum:
          - USER_CONFIRMED
        userConfirmed:
          type: boolean
          enum:
          - true
        revision:
          type: integer
          format: int64
          minimum: 0
      required:
      - id
      - phase
      - parkedAt
      - source
      - userConfirmed
      - revision
    PhaseEvent:
      type: object
      properties:
        id: *id001
        phase:
          type: string
          enum:
          - DRIVING
          - WALKING
          - AT_DESTINATION
          - RETURNING
        observedAt: *id004
        source:
          type: string
          enum:
          - USER_CONFIRMED
        userConfirmed:
          type: boolean
          enum:
          - true
        revision:
          type: integer
          format: int64
          minimum: 0
      required:
      - id
      - phase
      - observedAt
      - source
      - userConfirmed
      - revision
    ClientStatus:
      type: object
      properties:
        planVersion: *id015
        installationId: *id001
        status: *id016
        observedAt: *id004
        current: *id005
      required:
      - planVersion
      - installationId
      - status
      - observedAt
      - current
    Reminder:
      type: object
      properties:
        id: *id001
        anchor:
          type: string
          enum:
          - PARKING_CONFIRMED
          - PERSON_ARRIVAL_CONFIRMED
        stayMinutes:
          type: integer
          format: int64
          minimum: 1
        leadMinutes:
          type: integer
          format: int64
          minimum: 0
        reminderBasis:
          type: string
          enum:
          - STAY_END
          - RETURN_TO_CAR
        returnWalkSeconds:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        remindAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - DISABLED
          - WAITING_FOR_ANCHOR
          - PLANNED
          - CANCELLED
        version:
          type: integer
          format: int64
          minimum: 0
        clientStatuses:
          type: array
          items:
            $ref: '#/components/schemas/ClientStatus'
        schedulingMode:
          type: string
          enum:
          - CLIENT_LOCAL
        deliveryGuarantee:
          type: string
          enum:
          - NONE
        planRevision:
          type: integer
          format: int64
          minimum: 0
        anchorConfirmedAt:
          type: string
          format: date-time
          nullable: true
          description: Actual confirmed milestone used for this anchor; null while awaiting confirmation. Omitted
            when no reminder plan exists.
      required:
      - status
      - version
      - remindAt
      - clientStatuses
      - schedulingMode
      - deliveryGuarantee
      description: 'Without a saved plan: DISABLED, version 0, null remindAt; other plan fields omitted. PUT additionally
        returns planRevision. Client statuses scoped to the current participant; never proof of notification delivery.'
    Plan:
      type: object
      properties:
        destination:
          $ref: '#/components/schemas/PlanningPlace'
        arrivalBasis:
          type: string
          enum:
          - PERSON
          - VEHICLE
          default: PERSON
        deadlineAt:
          type: string
          format: date-time
          nullable: true
        plannedStayMinutes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10080
          nullable: true
        timeZone:
          type: string
          minLength: 1
          example: Asia/Seoul
        startsAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        ownerRole:
          type: string
          enum: *id017
          default: DRIVER
        title:
          type: string
          maxLength: 120
          nullable: true
      required:
      - destination
      - timeZone
      description: 'Create defaults to PLANNED, owner DRIVER, PERSON basis. Expiry must be in future, <=30 days
        from now, and cover max(now, startsAt, deadlineAt) + plannedStayMinutes. Default expiry is that anchor +1
        day +planned stay. PATCH is full plan replacement: omitted optional fields clear/reset except expiresAt
        retains prior value, which must still cover the revised plan; ownerRole must be omitted/null.'
    TransitionRequest:
      type: object
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
      description: Trip version, not planRevision. Omitted expectedVersion defaults to 0.
    Transition:
      type: object
      properties:
        id: *id001
        status:
          type: string
          enum:
          - ACTIVE
          - ENDED
          - CANCELLED
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - id
      - status
      - version
    Me:
      type: object
      properties:
        userId: *id001
        displayName:
          type: string
        serverTime: *id004
      required:
      - userId
      - displayName
      - serverTime
    TripListItem:
      type: object
      properties:
        id: *id001
        title:
          type: string
          nullable: true
        status: *id018
        destinationName:
          type: string
        planRevision:
          type: integer
          format: int64
          minimum: 0
        expiresAt: *id004
      required:
      - id
      - title
      - status
      - destinationName
      - planRevision
      - expiresAt
    TripList:
      type: object
      properties:
        trips:
          type: array
          items:
            $ref: '#/components/schemas/TripListItem'
          maxItems: 100
        serverTime: *id004
      required:
      - trips
      - serverTime
      description: Newest 100 active memberships only. No pagination cursor, nextCursor or historical membership
        recovery API.
    Participant:
      type: object
      properties:
        id: *id001
        role: *id008
        displayName:
          type: string
        ready: *id005
        readyUpdatedAt:
          type: string
          format: date-time
          nullable: true
        consentVersion:
          type: integer
          format: int64
          minimum: 0
      required:
      - id
      - role
      - displayName
      - ready
      - readyUpdatedAt
      - consentVersion
    Capabilities:
      type: object
      properties:
        navigation:
          $ref: '#/components/schemas/NavigationAvailability'
      required:
      - navigation
    Trip:
      type: object
      properties:
        id: *id001
        status: *id018
        phase:
          type: string
          enum:
          - DRIVING
          - PARKED
          - WALKING
          - AT_DESTINATION
          - RETURNING
          - null
          nullable: true
        revision:
          type: integer
          format: int64
          minimum: 0
        planRevision:
          type: integer
          format: int64
          minimum: 0
        version:
          type: integer
          format: int64
          minimum: 0
        title:
          type: string
          nullable: true
        destination:
          $ref: '#/components/schemas/PlanningPlace'
        deadlineAt:
          type: string
          format: date-time
          nullable: true
        arrivalBasis:
          type: string
          enum:
          - PERSON
          - VEHICLE
        plannedStayMinutes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10080
          nullable: true
        timeZone:
          type: string
        expiresAt: *id004
        sharing:
          anyOf:
          - $ref: '#/components/schemas/SharingSession'
          - type: object
            nullable: true
            enum:
            - null
        location:
          anyOf:
          - $ref: '#/components/schemas/Location'
          - type: object
            nullable: true
            enum:
            - null
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        serverTime: *id004
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
        viewer:
          $ref: '#/components/schemas/Viewer'
      required:
      - id
      - status
      - phase
      - revision
      - planRevision
      - version
      - title
      - destination
      - deadlineAt
      - arrivalBasis
      - plannedStayMinutes
      - timeZone
      - expiresAt
      - sharing
      - location
      - participants
      - capabilities
      - serverTime
      - stops
      - viewer
      description: Permission-filtered snapshot. Location null without fresh <=120s point and both publisher publication
        and viewer view consent. Participants empty without current collaboration consent. No raw secrets, proposal
        collection or startsAt in this response. Terminal owner reads omit shared data.
    Viewer:
      type: object
      required:
      - participantId
      - role
      - isOwner
      - clientType
      properties:
        participantId: *id002
        role:
          type: string
          enum:
          - DRIVER
          - COMPANION
        isOwner:
          type: boolean
        clientType:
          type: string
          enum:
          - PHONE
          - VEHICLE
      description: Current authorized caller membership, not another participant identity. Ownership is separate
        from travel role. Vehicle cannot become owner.
    ProposalListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - DESTINATION
          - STOP
          - PARKING
        decisionStatus:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - DISMISSED
          - CANCELLED
        version:
          type: integer
          format: int64
          minimum: 0
        place:
          $ref: '#/components/schemas/Place'
        navigationCommand:
          anyOf:
          - $ref: '#/components/schemas/NavigationCommand'
          - type: object
            nullable: true
            enum:
            - null
      required:
      - id
      - kind
      - decisionStatus
      - version
      - place
      - navigationCommand
      description: Proposal decision and associated command outcome are separate. Null command means no acceptance
        command exists.
    ProposalList:
      type: object
      required:
      - proposals
      - nextCursor
      - serverTime
      properties:
        proposals:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProposalListItem'
        nextCursor:
          type: string
          format: uuid
          nullable: true
        serverTime:
          type: string
          format: date-time
      description: Newest first by created_at then id, restricted to current sharing generation. nextCursor is last
        returned proposal id only when another page exists; null otherwise. Poll newest page again after reconnect,
        not only old cursor pages.
    OwnConsents:
      type: object
      required:
      - sessionId
      - generation
      - version
      - scopes
      properties:
        sessionId:
          type: string
          format: uuid
        generation:
          type: integer
          format: int64
          minimum: 1
        version:
          type: integer
          format: int64
          minimum: 0
        scopes:
          type: object
          properties:
            TRIP_COLLABORATION: &id019
              type: boolean
            LOCATION_VIEW: *id019
            LOCATION_PUBLISH: *id019
          additionalProperties: false
          required:
          - TRIP_COLLABORATION
          - LOCATION_VIEW
          - LOCATION_PUBLISH
      description: Complete active consent state for caller only, with all three booleans. Unlike consent PUT response,
        this is not a partial update echo. version is participant consentVersion.
  responses:
    Error400:
      description: Malformed or invalid fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_REQUEST
            message: Synthetic redacted error; inspect code and refresh when appropriate.
    Error401:
      description: Missing, invalid, expired or revoked credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Synthetic redacted error; inspect code and refresh when appropriate.
    Error403:
      description: Wrong trip, role, scope or consent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Synthetic redacted error; inspect code and refresh when appropriate.
    Error404:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Synthetic redacted error; inspect code and refresh when appropriate.
    Error409:
      description: State, version or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VERSION_CONFLICT
            message: Synthetic redacted error; inspect code and refresh when appropriate.
    Error429:
      description: Local safety limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PAIRING_RATE_LIMIT
            message: Synthetic redacted error; inspect code and refresh when appropriate.
    Error412:
      description: If-Match does not match current plan revision.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PLAN_REVISION_CONFLICT
            message: Synthetic redacted error; inspect code and refresh when appropriate.
    Error428:
      description: Required If-Match is missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: IF_MATCH_REQUIRED
            message: Synthetic redacted error; inspect code and refresh when appropriate.
    Error503:
      description: External provider unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: ROUTING_UNAVAILABLE
            message: Synthetic redacted error; inspect code and refresh when appropriate.
