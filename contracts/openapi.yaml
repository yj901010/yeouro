      parameters:
      - name: tripId
        in: path
        required: true
        schema: *id001
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
      additionalProperties: false
    Place:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
      additionalProperties: false
    CreateTripRequest:
      type: object
      required:
      - destination
      properties:
        destination:
          $ref: '#/components/schemas/Place'
      additionalProperties: false
    ConsentRequest:
      type: object
      required:
      - consent
      - role
      properties:
        consent: &id002
          type: boolean
        role:
          type: string
          enum:
          - DRIVER
          - COMPANION
      additionalProperties: false
    JoinRequest:
      type: object
      required:
      - code
      - displayName
      - consent
      properties:
        code:
          type: string
          minLength: 20
          maxLength: 64
        displayName:
          type: string
          minLength: 1
          maxLength: 40
        consent: *id002
      additionalProperties: false
    ReadinessRequest:
      type: object
      required:
      - ready
      properties:
        ready: *id002
      additionalProperties: false
    ProposalRequest:
      type: object
      required:
      - requestId
      - place
      properties:
        requestId: *id001
        place:
          $ref: '#/components/schemas/Place'
      additionalProperties: false
    DecisionRequest:
      type: object
      required:
      - decision
      - expectedVersion
      properties:
        decision:
          type: string
          enum:
          - ACCEPT
          - DISMISS
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
    NavigationResultRequest:
      type: object
      required:
      - outcome
      properties:
        outcome:
          type: string
          enum:
          - APPLIED
          - FAILED
          - DEMO_APPLIED
        reason:
          type: string
          maxLength: 200
          nullable: true
      additionalProperties: false
    Location:
      type: object
      required:
      - latitude
      - longitude
      - accuracyMeters
      - observedAt
      - source
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          format: double
          minimum: 0
          maximum: 10000
        observedAt: &id003
          type: string
          format: date-time
        source:
          type: string
          enum:
          - PHONE
          - VEHICLE
          - SIMULATED
      additionalProperties: false
    Participant:
      type: object
      required:
      - id
      - displayName
      - role
      - ready
      properties:
        id: *id001
        displayName:
          type: string
        role:
          type: string
          enum:
          - DRIVER
          - COMPANION
        ready: *id002
      additionalProperties: false
    Proposal:
      type: object
      required:
      - id
      - participantId
      - place
      - status
      - version
      - resultReason
      properties:
        id: *id001
        participantId: *id001
        place:
          $ref: '#/components/schemas/Place'
        status:
          type: string
          enum:
          - PENDING
          - APPLY_REQUESTED
          - DISMISSED
          - APPLIED
          - FAILED
          - DEMO_APPLIED
          - CANCELLED
        version:
          type: integer
          format: int64
        resultReason:
          type: string
          nullable: true
      additionalProperties: false
    NavigationStatus:
      type: object
      required:
      - provider
      - availability
      - reason
      properties:
        provider:
          type: string
          enum:
          - PLEOS
        availability:
          type: string
          enum:
          - UNAVAILABLE
        reason:
          type: string
          enum:
          - SDK_NOT_CONNECTED
      additionalProperties: false
    Trip:
      type: object
      required:
      - id
      - destination
      - status
      - sharingEnabled
      - version
      - expiresAt
      - participants
      - proposals
      - location
      - navigation
      properties:
        id: *id001
        destination:
          $ref: '#/components/schemas/Place'
        status:
          type: string
          enum:
          - ACTIVE
          - ENDED
        sharingEnabled: *id002
        version:
          type: integer
          format: int64
        expiresAt: *id003
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/Proposal'
        location:
          allOf:
          - $ref: '#/components/schemas/Location'
          nullable: true
        navigation:
          $ref: '#/components/schemas/NavigationStatus'
      additionalProperties: false
    SessionResponse:
      type: object
      required:
      - trip
      - accessToken
      - role
      - participantId
      - expiresAt
      properties:
        trip:
          $ref: '#/components/schemas/Trip'
        accessToken:
          type: string
        role:
          type: string
          enum:
          - OWNER
          - DRIVER
          - COMPANION
        participantId:
          type: string
          format: uuid
          nullable: true
        expiresAt: *id003
      additionalProperties: false
    InviteResponse:
      type: object
      required:
      - code
      - expiresAt
      properties:
        code:
          type: string
        expiresAt: *id003
      additionalProperties: false
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
      additionalProperties: false
