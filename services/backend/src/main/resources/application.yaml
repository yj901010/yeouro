server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: yeouro-backend
  datasource:
    url: jdbc:h2:file:./data/yeouro;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
