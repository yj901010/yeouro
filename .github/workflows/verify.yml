name: Verify MVP foundation
on:
  pull_request:
  push:
    branches: [main, 'feat/android-mvp-foundation', 'feat/backend-v2-design']
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: prototype
  backend:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/yeouro_test
      TEST_DATABASE_USERNAME: yeouro
      TEST_DATABASE_PASSWORD: local-ci-only
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: yeouro_test
          POSTGRES_USER: yeouro
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yeouro -d yeouro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sh ./mvnw --batch-mode test
        working-directory: services/backend
  shared-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sh ./gradlew -PjvmOnly=true test --no-daemon
        working-directory: apps/android
